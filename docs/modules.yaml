package: robotsix_github_auth
modules:
  - id: root
    description: Root-level project configuration files
    paths:
      - README.md
      - CHANGELOG.md
      - release-please-config.json
      - .release-please-manifest.json
      - SECURITY.md
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .pre-commit-config.yaml

  - id: ci
    description: CI workflow definitions
    paths:
      - .github/actions/**
      - .github/workflows/**
      - .github/workflows/release-please.yml
      - docs/ci/**

  - id: mill
    description: robotsix-mill periodic workflow configurations
    paths:
      - .robotsix-mill/**

  - id: docs
    description: Project documentation
    paths:
      - docs/modules.yaml

  - id: scripts
    description: Utility scripts for CI and development workflows
    paths:
      - scripts/**
      - tests/scripts/**

  - id: core
    description: Core GitHub App auth library — JWT signing, token minting, caching, scope validation
    paths:
      - changelog.d/*.md
      - src/robotsix_github_auth/**
      - tests/core/**

  - id: tests
    description: Test suite for the GitHub auth library
    paths:
      - tests/__init__.py
