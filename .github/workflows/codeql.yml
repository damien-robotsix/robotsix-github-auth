name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    permissions:
      actions: read  # CodeQL reads workflow run metadata for the analysis
      contents: read  # check out the repository
      security-events: write  # upload CodeQL SARIF results to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      languages: python
      build-mode: none
      queries: security-and-quality
