name: Lint Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      run-actionlint: true
      run-zizmor: true
