name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard analysis
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/scorecard.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0