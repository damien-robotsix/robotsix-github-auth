name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: "1"

jobs:
  python-security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
    with:
      python-version: "3.14"
      install-extras: "dev"
    permissions:
      contents: read

  lint:
    name: Python CI / Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: deptry (dependency hygiene)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with deptry deptry .
      - name: Dependency audit (CVE scan)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          if uv audit --help >/dev/null 2>&1; then
            uv audit --frozen --preview
          else
            uv export --frozen --no-hashes | grep -v '^-e \.' | uv run --with pip-audit pip-audit -r /dev/stdin
          fi
      - name: Ruff (lint + format check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check --diff .

  typecheck:
    name: Python CI / Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: Mypy (static type check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict
      - name: Bandit (security SAST)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with 'bandit[toml]' bandit -c pyproject.toml -r src/ --severity-level medium

  test:
    name: Python CI / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run --with pytest-xdist --with pytest-cov pytest tests/ -n auto --dist loadscope -x -m "not docker" --tb=long --cov="robotsix_github_auth" --cov-fail-under="80" --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Combine coverage data
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with coverage coverage combine || true
      - name: Assert coverage database exists
        run: test -f .coverage
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: |
            coverage.xml
            .coverage
          if-no-files-found: error

  lockfile-check:
    name: lockfile-check
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv lock --check

  modules:
    name: modules
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen robotsix-modules check-registration docs/modules.yaml --root .

  ci-conventions:
    name: ci-conventions
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/check_ci_conventions.py