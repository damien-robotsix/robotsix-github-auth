name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: "1"

jobs:
  python-security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
    with:
      python-version: "3.14"
      install-extras: "dev"
    permissions:
      contents: read

  lint:
    name: Python CI / Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: deptry (dependency hygiene)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with deptry deptry .
      - name: Dependency audit (CVE scan)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          if uv audit --help >/dev/null 2>&1; then
            uv audit --frozen --preview
          else
            uv export --frozen --no-hashes | grep -v '^-e \.' | uv run --with pip-audit pip-audit -r /dev/stdin
          fi
      - name: Ruff (lint + format check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check --diff .

  typecheck:
    name: Python CI / Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: Mypy (static type check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict
      - name: Bandit (security SAST)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with 'bandit[toml]' bandit -c pyproject.toml -r src/ --severity-level medium

  test:
    name: Python CI / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@fb55ad2ad906d1628c5e2a8eb6e72e67ee4e0f62  # main
        with:
          python-version: "3.14"
          uv-version: "0.8.15"
          install-extras: "dev"
      - name: Enforce coverage floor (hard minimum 80)
        run: |
          if [ "80" -lt 80 ]; then
            echo "::error::coverage-threshold=80 is below the fleet-wide hard minimum of 80."
            exit 1
          fi
      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run --with pytest-xdist --with pytest-cov pytest tests/ -n auto --dist loadscope -x -m "not docker" --tb=long --cov="robotsix_github_auth" --cov-fail-under="80" --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Combine coverage data
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with coverage coverage combine || true
      - name: Assert coverage database exists
        run: test -f .coverage
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data
          path: |
            coverage.xml
            .coverage
          if-no-files-found: error

  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv lock --check

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen robotsix-modules check-registration docs/modules.yaml --root .

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07  # v3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07  # v3

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uvx zizmor@1.27.0 --min-severity medium .github/workflows/

  ci-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/check_ci_conventions.py