name: Python CI setup
description: >
  Shared checkout + Python + uv + dev-deps install for the python-ci
  reusable workflow.  Extracted from python-ci.yml to eliminate
  duplicated setup boilerplate across the four jobs (lint, typecheck,
  test, tests).
inputs:
  python-version:
    description: Python version to set up.
    required: true
  uv-version:
    description: uv version to install.
    required: true
  install-extras:
    description: Extras to install (space-separated).
    required: false
    default: "tracing"
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        version: ${{ inputs.uv-version }}
    - name: Install dev deps
      shell: bash
      env:
        UV_PROJECT_ENVIRONMENT: system
        INSTALL_EXTRAS: ${{ inputs.install-extras }}
      run: |
        extras=""
        for x in $INSTALL_EXTRAS; do
          extras="$extras --extra $x"
        done
        uv sync --frozen $extras