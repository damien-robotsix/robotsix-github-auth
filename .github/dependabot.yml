# Dependabot version updates. PRs are verified by ci.yml and then
# approved/merged by dependabot-auto-merge.yml.
#
# Note: Dependabot cannot bump the reusable-workflow pins on
# damien-robotsix/robotsix-github-workflows (`@<sha>  # main`); those
# must be bumped manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
