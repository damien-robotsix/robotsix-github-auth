[project]
name = "robotsix-github-auth"
version = "0.4.6"
description = "Fleet-wide GitHub App authorization library: JWT signing + installation-token minting/caching + scope validation."
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15.0",
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@791dcf356f35103dd8a22dec1ebeefbaeb2a5c00",
]

[project.optional-dependencies]
dev = [
    "cryptography>=50.0.0",
    "pytest>=9",
    "pytest-httpx>=0.35",
    "pyyaml>=6",
    "robotsix-modules @ git+https://github.com/damien-robotsix/robotsix-modules.git@7bb8157088dc8599c44b11803dbb83403bca8f98",
    "ruff>=0.9",
    "mypy>=1.14",
    "deptry>=0.23",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Direct (PEP 508 git) references in [project] metadata require hatchling
# to permit them (unversioned robotsix-http audit fix).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_github_auth"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Standards baseline (E, F, I, W, S) plus the repo's existing extras
# (N, UP, B) — see robotsix-standards docs/ruff-lint-rules.md.
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]
extend-select = [
    "D",   # pydocstyle — Google-style docstrings (docs/docstrings.md)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
    "ERA", # eradicate (commented-out code)
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
]
ignore = ["D105", "D107", "D205", "D415", "PT006"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["robotsix_github_auth"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (S101) / dummy credentials (S105–S108)
# and don't carry Google-style docstrings (D); __init__.py files need no
# package docstring (D104). Per robotsix-standards docs/docstrings.md and
# docs/python.md.
"tests/**" = ["D", "S101", "S105", "S106", "S107", "S108", "S113"]
"*__init__.py" = ["D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "791dcf356f35103dd8a22dec1ebeefbaeb2a5c00" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "7bb8157088dc8599c44b11803dbb83403bca8f98" }

[tool.deptry]
known_first_party = ["robotsix_github_auth"]
optional_dependencies_dev_groups = ["dev"]

[tool.mypy]
strict = true
python_version = "3.14"
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["robotsix_http", "robotsix_http.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/robotsix_github_auth"]

[tool.coverage.report]
fail_under = 80
