[project]
name = "robotsix-github-auth"
version = "0.2.0"
description = "Fleet-wide GitHub App authorization library: JWT signing + installation-token minting/caching + scope validation."
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "robotsix-http",
]

[project.optional-dependencies]
dev = [
    "cryptography>=50.0.0",
    "pytest>=9",
    "pytest-httpx>=0.35",
    "pyyaml>=6",
    "robotsix-modules",
    "ruff>=0.9",
    "mypy>=1.14",
    "deptry>=0.23",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_github_auth"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.isort]
known-first-party = ["robotsix_github_auth"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S113"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "4cf79993f07c0d56e50cf02af816058144beacb9" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "c134bff092e71ef05a292d45759b01e4d5eb852f" }

[tool.deptry]
known_first_party = ["robotsix_github_auth"]
optional_dependencies_dev_groups = ["dev"]

[tool.mypy]
strict = true
python_version = "3.14"
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["robotsix_http", "robotsix_http.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/robotsix_github_auth"]

[tool.coverage.report]
fail_under = 80
